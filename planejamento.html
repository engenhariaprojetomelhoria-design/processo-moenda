<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Processo Moenda - Planejamento</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <h1>Processo Moenda</h1>
      <div class="subtitle">Controle de ferramentas e insertos</div>
      <nav class="nav">
        <a href="dashboard.html" data-page="dashboard">Dashboard</a>
        <a href="planejamento.html" data-page="planejamento">Planejamento</a>
        <a href="maquinas.html" data-page="maquinas">Máquinas</a>
        <a href="ferramentas.html" data-page="ferramentas">Ferramentas</a>
        <a href="insertos.html" data-page="insertos">Insertos</a>
        <a href="materiais.html" data-page="materiais">Materiais</a>
        <a href="historico.html" data-page="historico">Histórico</a>
      </nav>
    </aside>

    <main class="main">
      <section class="topbar">
        <div>
          <h2>Planejamento</h2>
          <div>Cálculo automático da ferramenta, inserto e quantidade necessária</div>
        </div>
        <div class="user-info">
          <div id="userInfo"></div>
          <button id="logoutBtn" class="secondary">Sair</button>
        </div>
      </section>

      <section class="grid grid-2">
        <div class="card">
          <h3>Dados do processo</h3>

          <label>Máquina</label>
          <select id="maquina"><option value="">Carregando máquinas...</option></select>

          <label>Material</label>
          <select id="material"><option value="">Carregando materiais...</option></select>

          <label>Diâmetro da camisa</label>
          <input id="diametroCamisa" type="number" step="0.01"/>

          <label>Deslocamento maior em X</label>
          <input id="deslocamentoX" type="number" step="0.01"/>

          <label>Profundidade do furo</label>
          <input id="profundidadeFuro" type="number" step="0.01"/>

          <label>Altura do friso</label>
          <input id="alturaFriso" type="number" step="0.01"/>

          <label>Diâmetro do furo</label>
          <input id="diametroFuro" type="number" step="0.01"/>

          <label>Metragem total a usinar</label>
          <input id="metragemTotal" type="number" step="0.01"/>

          <button id="calcularBtn" class="success">Calcular planejamento</button>
          <button id="limparBtn" class="secondary">Limpar</button>

          <div id="msg"></div>
        </div>

        <div class="card">
          <h3>Resultado</h3>
          <div id="resultadoPlanejamento">Preencha os dados e clique em calcular.</div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/planejamento.js"></script>
</body>
</html>
